<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYPERSYNC — Tune In to Everything</title>
  <meta name="description" content="Your artists' news, socials, schedule, releases, and merch — synced into one place." />

  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="HYPERSYNC" />
  <meta property="og:title" content="HYPERSYNC — Tune In to Everything" />
  <meta property="og:description" content="Asian music, synchronized." />
  <meta property="og:image" content="https://www.hypersync.live/og-image.png" />
  <meta property="og:url" content="https://www.hypersync.live" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="HYPERSYNC — Tune In to Everything" />
  <meta name="twitter:image" content="https://www.hypersync.live/og-image.png" />

  <meta name="theme-color" content="#0C0C11" />
</head>
<body>
  <!-- Netlify reads forms from the built HTML at deploy time. A React app
       renders its form in JavaScript, so this hidden twin is what registers
       the form. Field names must match src/pages/Partners.jsx exactly. -->
  <form name="partners" netlify netlify-honeypot="company-website" hidden>
    <input type="text" name="name" />
    <input type="text" name="organization" />
    <input type="text" name="artist" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
    <input type="text" name="company-website" />
  </form>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
